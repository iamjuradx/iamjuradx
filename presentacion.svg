<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06101D"/>
      <stop offset="0.52" stop-color="#0A1B2D"/>
      <stop offset="1" stop-color="#07121F"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="40" x2="1120" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <clipPath id="portraitClip">
      <circle cx="1016" cy="180" r="112"/>
    </clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="29" stroke="#15304A" stroke-width="2"/>

  <!-- animated workflow lines -->
  <g opacity="0.28">
    <path d="M0 74H264L324 134H630" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="9 11">
      <animate attributeName="stroke-dashoffset" values="0;-80" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 300H930L870 240H646" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="9 11">
      <animate attributeName="stroke-dashoffset" values="0;80" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <g opacity="0.8" filter="url(#glow)">
    <circle cx="124" cy="74" r="4.5" fill="#38BDF8">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="240" r="4" fill="#2DD4BF">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1112" cy="72" r="3.5" fill="#60A5FA">
      <animate attributeName="r" values="3.5;6;3.5" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- portrait -->
  <circle cx="1016" cy="180" r="123" fill="#0B1E31" stroke="url(#accent)" stroke-width="3"/>
  <image x="904" y="68" width="224" height="224" href="data:image/jpeg;base64," clip-path="url(#portraitClip)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="1016" cy="180" r="112" stroke="#D7F4FF" stroke-opacity="0.22"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="74" y="112" fill="#EEF8FF" font-size="47" font-weight="750" letter-spacing="0.2">Juan Sebastián Jurado García</text>
    <text x="76" y="153" fill="#9FB4C8" font-size="20" font-weight="500">Professional Presentation · Systems &amp; Telecommunications Engineering Student</text>

    <rect x="74" y="184" width="610" height="52" rx="14" fill="#0C2236" stroke="#1D4563"/>
    <circle cx="102" cy="210" r="6" fill="#2DD4BF"/>
    <text x="122" y="217" fill="url(#accent)" font-size="23" font-weight="700">Automation · Applied AI · API Integrations</text>

    <text x="76" y="273" fill="#D3DFEA" font-size="17.5" font-weight="500">n8n  •  REST APIs  •  Webhooks  •  RPA  •  Google Apps Script</text>
    <text x="76" y="302" fill="#93A8BB" font-size="16.5" font-weight="500">Python  •  JavaScript  •  SQL  •  Ruby on Rails  •  Data &amp; Workflow Automation</text>
  </g>

  <g transform="translate(714 188)">
    <circle cx="0" cy="0" r="4" fill="#38BDF8"/>
    <circle cx="34" cy="0" r="4" fill="#2DD4BF"/>
    <circle cx="68" cy="0" r="4" fill="#60A5FA"/>
    <path d="M4 0H30M38 0H64" stroke="#2A5A77" stroke-width="2"/>
    <animateTransform attributeName="transform" type="translate" values="714 188;724 188;714 188" dur="4.5s" repeatCount="indefinite"/>
  </g>
</svg>
